name: Service Release

on:
  push:
    branches:
      - main

jobs:
  bump_version:
    runs-on: ubuntu-24.04
    name: "Bump version"
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"
          ref: "main"

      - id: cz
        name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: "main"
          git_name: ${{ secrets.GIT_NAME }}
          git_email: ${{ secrets.GIT_EMAIL }}
          changelog_increment_filename: body.md

      - name: Print Version
        run: echo "Bumped to version v${{ env.REVISION }}"

      - name: Trim body to 125000 characters
        run: |
          if [ $(wc -c < body.md) -gt 125000 ]; then
            head -c 125000 body.md > body.md
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: "body.md"
          tag_name: v${{ env.REVISION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: "true"

  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    needs: bump_version
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v6
        with:
          name: pants-plugin-pkl
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: 
      name: pypi
      url: https://pypi.org/p/pants-plugin-pkl
    permissions:
      id-token: write
    steps:
      - name: Download pants-plugin-pkl artifact
        uses: actions/download-artifact@v6
        with:
          name: pants-plugin-pkl
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
