[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pants-plugin-pkl"
version = "1.0.0"
description = "Pants build system plugin for the PKL configuration language"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Draftea" }]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Drafteame/pants-plugin-pkl"
Repository = "https://github.com/Drafteame/pants-plugin-pkl"
Documentation = "https://github.com/Drafteame/pants-plugin-pkl/blob/main/docs/index.md"
"Bug Tracker" = "https://github.com/Drafteame/pants-plugin-pkl/issues"

[tool.hatch.build.targets.wheel]
packages = ["pants-plugins/pkl"]

[tool.hatch.build.targets.wheel.sources]
"pants-plugins/pkl" = "pkl"

[tool.hatch.build.targets.sdist]
include = [
  "pants-plugins/pkl/**",
  "README.md",
  "LICENSE",
]